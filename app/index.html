<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Trophy Path — GTA VI trophy guide &amp; tracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Leonida Trophy Path</h1>
      <p class="brand-sub">GTA VI · PS5 · 55 trophies · offline guide &amp; tracker</p>
    </div>
  </div>
  <section class="progress" id="progress" aria-live="polite"></section>
  <div class="spoiler-ctl" id="spoiler-ctl" role="group" aria-label="Spoiler setting"></div>
  <div class="io">
    <button id="export" type="button" class="btn">⬇ Export</button>
    <label class="btn" for="import">⬆ Import<input id="import" type="file" accept="application/json,.json" hidden></label>
  </div>
</header>

<nav class="filterbar" aria-label="Views and filters">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="chips" id="kind-chips" role="group" aria-label="Filter by kind"></div>
  <div class="chips grades" id="grade-chips" role="group" aria-label="Filter by grade"></div>
  <input id="search" class="search" type="search" placeholder="Search trophies, missions, places…" aria-label="Search">
</nav>

<main id="view-list" class="split">
  <section class="checklist" id="checklist" aria-label="Trophy checklist"></section>
  <aside class="guide" id="guide" aria-label="Trophy guide"></aside>
</main>
<main id="view-roadmap" class="roadmap" hidden aria-label="Roadmap to the platinum"></main>

<p class="toast" id="toast" role="status" hidden></p>
<script type="module" src="js/main.js"></script>
</body>
</html>
